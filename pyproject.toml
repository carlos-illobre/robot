# Configuración de las herramientas de Python (no es un paquete instalable).

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --cov --cov-branch --cov-report=term-missing:skip-covered --cov-report=html --cov-report=xml --cov-report=json:coverage/backend/coverage.json"

[tool.coverage.run]
# Spec 007: todo el backend y el arranque multiplataforma.
include = ["backend/*", "iniciar.py"]
omit = ["backend/tests/*"]
branch = true

[tool.coverage.report]
# Spec 007: 100 % de líneas y ramas o la CI falla.
fail_under = 100
show_missing = true
precision = 1

[tool.coverage.html]
directory = "coverage/backend"
title = "Cobertura del backend · TP05"

[tool.coverage.xml]
output = "coverage/backend/coverage.xml"

[tool.mutmut]
# Pruebas de mutación del backend (spec 008). `npm run mutation:backend`
source_paths = ["backend/", "iniciar.py"]
do_not_mutate = ["backend/tests/*"]
# servidor.py sirve el dashboard si existe frontend/: hace falta en la copia que muta mutmut
also_copy = ["frontend/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "--no-cov", "-q"]
pytest_add_cli_args_test_selection = ["backend/tests/"]
