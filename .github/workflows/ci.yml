name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest + cobertura, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 es la mínima que soporta el proyecto (y la de la imagen Docker):
        # ahí apareció el error del WebSocket que 3.12 no mostraba.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      # Falla si la cobertura baja del umbral de pyproject.toml (spec 007)
      - run: python -m pytest

  frontend:
    name: Frontend (Vitest + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Falla si la cobertura baja de los umbrales de vitest.config.js (spec 007)
      - run: npm run coverage

  e2e:
    name: E2E (Playwright + backend real)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PYTHON: python
