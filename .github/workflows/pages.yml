name: GitHub Pages (dashboard + visor de maquetas)

# Publica en la rama gh-pages:
#   /       visor de maquetas (docs/design)
#   /app/   el dashboard real, con la simulación del navegador (sin servidor)
on:
  push:
    paths: ["docs/design/**", "frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -r docs/design/. _site/
          mkdir -p _site/app
          cp -r frontend/. _site/app/
          rm -rf _site/app/tests
          touch _site/.nojekyll
      - name: Publicar en gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sitio desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
