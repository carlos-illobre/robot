# Versión dockerizada (opcional). La forma recomendada sigue siendo `python iniciar.py`.
# Uso: ver docker/README.md
#
#   docker compose -f docker/docker-compose.yml up demo
#   ROBOT=go2 INTERFAZ=enp3s0 docker compose -f docker/docker-compose.yml --profile robot up robot

services:
  # Demo: funciona en cualquier sistema (Linux, Windows, macOS).
  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tp05-dashboard
    ports:
      - "8001:8001"
    environment:
      # Levanta también el simulador MuJoCo de la cátedra (sin ventana), para poder
      # elegirlo en el panel de fuentes. Vacío = no levantarlo.
      SIMULADOR: "${SIMULADOR-${ROBOT:-go2}}"
    command: ["--demo", "--robot", "${ROBOT:-go2}"]
    restart: unless-stopped

  # Robot real: SOLO en Linux. Usa la red del equipo (network_mode: host)
  # porque DDS necesita ver la placa de red conectada al robot.
  robot:
    profiles: ["robot"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tp05-dashboard
    network_mode: host
    # INTERFAZ: placa de red hacia el robot (p. ej. enp3s0). Vacía = la elige el SDK.
    command: ["--real", "--robot", "${ROBOT:-go2}", "--interfaz", "${INTERFAZ:-}"]
    restart: unless-stopped
